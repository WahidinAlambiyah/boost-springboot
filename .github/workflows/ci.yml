name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  authorization-gate:
    name: Authorization RBAC Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run AuthorizationMatrixTest (hard gate for RBAC regression)
        run: mvn -B -Dtest=AuthorizationMatrixTest test

  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: authorization-gate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run test suite (including architecture and OpenAPI docs checks)
        run: mvn -B test

      - name: Verify OpenAPI spec artifact is generated
        run: test -s target/openapi/openapi.json

      - name: Upload OpenAPI spec artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: target/openapi/openapi.json
          if-no-files-found: warn

  frontend-tests:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap Playwright browsers and system dependencies
        run: npx playwright install --with-deps

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend unit and integration tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Run frontend e2e smoke test (hard gate)
        continue-on-error: false
        run: npm run test:e2e
