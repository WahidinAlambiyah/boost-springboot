services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    container_name: ${CONTAINER_NAME:-wahidin-purchaseorder-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wahidin-purchaseorder}
      POSTGRES_USER: ${POSTGRES_USER:-wahidin-purchaseorder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wahidin-purchaseorder}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
    driver: local
