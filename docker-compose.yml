version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: quarkus_user_auth_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-quarkus_user_auth}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: quarkus_user_auth_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
