# ========= App =========
quarkus.application.name=boost
quarkus.http.port=${SERVER_PORT:8080}
# setara server.port :contentReference[oaicite:4]{index=4}

# ========= Datasource (PostgreSQL) =========
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:boost}
quarkus.datasource.password=${DB_PASSWORD:boost}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:boost}?currentSchema=${DB_SCHEMA:fastworks_quarkus}
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Set search_path setiap koneksi baru (setara hikari.connection-init-sql)
quarkus.datasource.jdbc.new-connection-sql=SET search_path TO ${DB_SCHEMA:fastworks_quarkus}
#:contentReference[oaicite:5]{index=5}

# Setara hikari.data-source-properties.*
quarkus.datasource.jdbc.additional-jdbc-properties.prepareThreshold=0
#:contentReference[oaicite:6]{index=6}
quarkus.datasource.jdbc.additional-jdbc-properties.preferQueryMode=simple
#:contentReference[oaicite:7]{index=7}

# ========= Hibernate ORM (setara spring.jpa.*) =========
# spring.jpa.hibernate.ddl-auto: none
quarkus.hibernate-orm.schema-management.strategy=none
#:contentReference[oaicite:8]{index=8}

# default schema (setara hibernate.default_schema)
quarkus.hibernate-orm.database.default-schema=${DB_SCHEMA:fastworks_quarkus}
#:contentReference[oaicite:9]{index=9}

# setara hibernate.jdbc.time_zone=UTC
quarkus.hibernate-orm.jdbc.timezone=UTC
#:contentReference[oaicite:10]{index=10}

# ========= Liquibase (setara spring.liquibase.*) =========
quarkus.liquibase.migrate-at-start=true
#:contentReference[oaicite:11]{index=11}
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml
#:contentReference[oaicite:12]{index=12}
quarkus.liquibase.default-schema-name=${DB_SCHEMA:fastworks_quarkus}
#:contentReference[oaicite:13]{index=13}
quarkus.liquibase.liquibase-schema-name=${DB_SCHEMA:fastworks_quarkus}
#:contentReference[oaicite:14]{index=14}

# ========= Redis (setara spring.data.redis.*) =========
quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
#:contentReference[oaicite:15]{index=15}
app.redis.enabled=${REDIS_ENABLED:false}

# ========= OpenAPI & Swagger UI (setara springdoc.*) =========
quarkus.smallrye-openapi.path=/v3/api-docs
#:contentReference[oaicite:16]{index=16}
quarkus.swagger-ui.path=/swagger-ui.html
#:contentReference[oaicite:17]{index=17}
quarkus.swagger-ui.always-include=true
#:contentReference[oaicite:18]{index=18}

# ========= Management endpoints (mirip actuator exposure) =========
# Quarkus: health ada di /q/health kalau pakai extension smallrye-health
# Quarkus: info ada di /q/info kalau pakai extension quarkus-info :contentReference[oaicite:19]{index=19}

# ========= App-specific configs (bebas, seperti Spring) =========
security.jwt.issuer=boost-api
security.jwt.secret=${JWT_SECRET:change-me-please-change-me-please-change-me}
security.jwt.access-token-ttl-minutes=15
security.jwt.refresh-token-ttl-days=7

security.login.max-failed-attempts=5
security.login.lock-minutes=15

app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P7D
app.jwt.issuer=quarkus-user-auth

smallrye.jwt.sign.key=${JWT_SECRET:change-me}
smallrye.jwt.verify.key=${JWT_SECRET:change-me}
smallrye.jwt.sign.issuer=${app.jwt.issuer}
mp.jwt.verify.issuer=${app.jwt.issuer}

app.cache.user-ttl=PT5M

app.seed.admin.enabled=${ADMIN_SEED_ENABLED:false}
app.seed.admin.username=${ADMIN_USERNAME:admin}
app.seed.admin.email=${ADMIN_EMAIL:admin@example.com}
app.seed.admin.full-name=${ADMIN_FULL_NAME:System Administrator}
app.seed.admin.password=${ADMIN_PASSWORD:Admin123!}

%dev.quarkus.swagger-ui.always-include=true
%dev.quarkus.smallrye-openapi.path=/openapi
%dev.quarkus.swagger-ui.path=/swagger-ui