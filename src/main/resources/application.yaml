app:
  github-username: ${APP_GITHUB_USERNAME:defaultuser}

frankfurter:
  base-url: ${EXTERNAL_API_BASE_URL:https://api.frankfurter.app}

server:
  port: 8124

spring:
  application:
    admin:
      enabled: true
    name: exchangerate
  config:
    import: optional:file:.env[.properties]
  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      tags-sorter: alpha
      operations-sorter: alpha
      default-models-expand-depth: -1
    api-docs:
      path: /v3/api-docs  
