spring:
  application:
    name: boost
  config:
    import: optional:file:.env[.properties]
  datasource:
    hikari:
      schema: ${DB_SCHEMA:app}
      connection-init-sql: SET search_path TO ${DB_SCHEMA:app}
      data-source-properties:
        prepareThreshold: 0
        preferQueryMode: simple
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appdb}?currentSchema=${DB_SCHEMA:app}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:app}
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    default-schema: ${DB_SCHEMA:app}
    schemas: ${DB_SCHEMA:app}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  redis:
    enabled: ${REDIS_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    issuer: boost-api
    secret: ${JWT_SECRET:dev-secret-change-me-min-32-chars}
    access-token-ttl-minutes: ${JWT_TTL_MINUTES:15}
    refresh-token-ttl-days: ${REFRESH_TTL_DAYS:30}
