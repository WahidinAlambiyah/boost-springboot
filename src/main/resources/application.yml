spring:
  application:
    name: boost-springboot
  config:
    import: optional:file:.env[.properties]
  datasource:
    hikari:
      schema: ${DB_1_SCHEMA:protoone}
      connection-init-sql: SET search_path TO ${DB_1_SCHEMA:protoone}
      data-source-properties:
        prepareThreshold: 0
        # opsional kalau masih bandel:
        preferQueryMode: simple
    # url: jdbc:postgresql://localhost:5432/boost
    # username: boost
    # password: boost
    url: jdbc:postgresql://${DB_1_HOST:localhost}:${DB_1_PORT:5432}/${DB_1_NAME:boost}?currentSchema=${DB_1_SCHEMA:protoone}
    username: "${DB_1_USER:boost}"
    password: "${DB_1_PASSWORD:boost}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_1_SCHEMA:protoone}
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
  mail:
    host: mail.alambiyah.com
    port: 465
    username: halo@alambiyah.com
    # Use an environment variable for security; the default keeps special characters intact when unset
    password: "${MAIL_PASSWORD:WlmfRTN5WScmGNHl}"
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          ssl:
            enable: true
        imap:
          ssl:
            enable: true

server:
  port: 8123

app:
  jwt:
    secret: change-me-to-a-strong-secret-key-change-me
    expiration-ms: 3600000
  redis:
    enabled: false
  kafka:
    enabled: false
  admin:
    username: admin
    password: password
  base-url:
    backend: https://protobeone.alambiyah.com
    frontend: https://protofeone.alambiyah.com
