spring:
  application:
    name: boost
  config:
    import: optional:file:.env[.properties]
  datasource:
    hikari:
      schema: ${DB_SCHEMA:fastworks_springboot}
      connection-init-sql: SET search_path TO ${DB_SCHEMA:fastworks_springboot}
      data-source-properties:
        prepareThreshold: 0
        preferQueryMode: simple
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:boost}?currentSchema=${DB_SCHEMA:fastworks_springboot}
    username: ${DB_USER:boost}
    password: ${DB_PASSWORD:boost}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:fastworks_springboot}
        jdbc:
          time_zone: UTC
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: ${DB_SCHEMA:fastworks_springboot}
    liquibase-schema: ${DB_SCHEMA:fastworks_springboot}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:mail.alambiyah.com}
    port: 465
    username: ${MAIL_USERNAME:halo@alambiyah.com}
    password: ${MAIL_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

app:
  redis:
    enabled: ${REDIS_ENABLED:false}
  security:
    enabled: ${SECURITY_ENABLED:true}
    method-security:
      enabled: ${METHOD_SECURITY_ENABLED:true}

server:
  port: ${SERVER_PORT:8123}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    issuer: boost-api
    secret: ${JWT_SECRET:change-me-please-change-me-please-change-me}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    default-models-expand-depth: -1
  api-docs:
    path: /v3/api-docs
