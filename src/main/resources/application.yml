spring:
  application:
    name: boost
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:boost}?currentSchema=protoone,public
    username: ${DB_USER:boost}
    password: ${DB_PASSWORD:boost}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: protoone
        jdbc:
          time_zone: UTC
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: protoone
    liquibase-schema: protoone
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    issuer: boost-api
    secret: ${JWT_SECRET:change-me-please-change-me-please-change-me}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  login:
    max-failed-attempts: 5
    lock-minutes: 15

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
