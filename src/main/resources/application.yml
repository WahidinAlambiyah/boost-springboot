spring:
  application:
    name: boost
  config:
    import: optional:file:.env[.properties]
  datasource:
    hikari:
      schema: ${DB_SCHEMA:fastworks_springboot}
      connection-init-sql: SET search_path TO ${DB_SCHEMA:fastworks_springboot}
      data-source-properties:
        prepareThreshold: 0
        # opsional kalau masih bandel:
        preferQueryMode: simple
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:boost}?currentSchema=${DB_SCHEMA:fastworks_springboot}
    username: ${DB_USER:boost}
    password: ${DB_PASSWORD:boost}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:fastworks_springboot}
        jdbc:
          time_zone: UTC
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: ${DB_SCHEMA:fastworks_springboot}
    liquibase-schema: ${DB_SCHEMA:fastworks_springboot}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    issuer: boost-api
    secret: ${JWT_SECRET:change-me-please-change-me-please-change-me}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  login:
    max-failed-attempts: 5
    lock-minutes: 15

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    default-models-expand-depth: -1
  api-docs:
    path: /v3/api-docs
