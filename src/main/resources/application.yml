spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wahidin-purchaseorder}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:wahidin-purchaseorder}
    password: ${DB_PASSWORD:wahidin-purchaseorder}
    hikari:
      connection-init-sql: "CREATE SCHEMA IF NOT EXISTS \"${DB_SCHEMA:public}\"; SET search_path TO \"${DB_SCHEMA:public}\", public"
      data-source-properties:
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

jwt:
  secret: "c2VjcmV0LWtleS1mb3ItcHVyY2hhc2Utb3JkZXItYXBwLXNob3VsZC1iZS1sb25nLWVuLWFuZC1yYW5kb20="
  expiration: 3600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    org.hibernate.SQL: DEBUG

server:
  port: 8080
