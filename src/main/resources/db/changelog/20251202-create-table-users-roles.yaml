databaseChangeLog:
  - changeSet:
      id: 001-create-role-and-user
      author: boost
      changes:
        - sql:
            dbms: postgresql
            sql: CREATE EXTENSION IF NOT EXISTS "pgcrypto";
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(150)
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMPTZ
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - addPrimaryKey:
            columnNames: user_id, role_id
            constraintName: pk_user_roles
            tableName: user_roles
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_role
            onDelete: CASCADE
        - createIndex:
            indexName: idx_user_roles_user
            tableName: user_roles
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_user_roles_role
            tableName: user_roles
            columns:
              - column:
                  name: role_id
  - changeSet:
      id: 002-seed-roles-and-admin
      author: boost
      changes:
        - insert:
            tableName: roles
            columns:
              - column: { name: id, value: "11111111-1111-1111-1111-111111111111" }
              - column: { name: name, value: ADMIN }
              - column: { name: description, value: Administrator }
        - insert:
            tableName: roles
            columns:
              - column: { name: id, value: "22222222-2222-2222-2222-222222222222" }
              - column: { name: name, value: USER }
              - column: { name: description, value: Standard user }
        - insert:
            tableName: users
            columns:
              - column: { name: id, value: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa" }
              - column: { name: username, value: admin }
              - column: { name: email, value: admin@example.com }
              - column: { name: password_hash, value: $2a$10$7EqJtq98hPqEX7fNZaFWoO5f.SG5.zj.B8GPUY5Y2G/92eN7wPFyW }
              - column: { name: full_name, value: Admin Account }
              - column: { name: is_active, valueBoolean: true }
        - insert:
            tableName: user_roles
            columns:
              - column: { name: user_id, value: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa" }
              - column: { name: role_id, value: "11111111-1111-1111-1111-111111111111" }
