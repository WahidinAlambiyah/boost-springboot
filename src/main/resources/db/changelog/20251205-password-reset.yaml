databaseChangeLog:
  - changeSet:
      id: 20251205-01-add-password-changed-at
      author: boost-assistant
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: password_changed_at
                  type: TIMESTAMPTZ
  - changeSet:
      id: 20251205-02-create-password-reset-tokens
      author: boost-assistant
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: expired_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: TIMESTAMPTZ
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: request_ip
                  type: VARCHAR(64)
              - column:
                  name: user_agent
                  type: VARCHAR(255)
        - addUniqueConstraint:
            tableName: password_reset_tokens
            columnNames: token
            constraintName: uq_password_reset_tokens_token
        - addForeignKeyConstraint:
            baseTableName: password_reset_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_password_reset_tokens_user
            onDelete: CASCADE
