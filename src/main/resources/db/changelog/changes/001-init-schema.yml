databaseChangeLog:
  - changeSet:
      id: 000-create-schema
      author: boost
      changes:
        - sql:
            dbms: postgresql,h2
            sql: CREATE SCHEMA IF NOT EXISTS ${schema}
  - changeSet:
      id: 001-create-users-and-roles
      author: boost
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: varchar(200)
        - addUniqueConstraint:
            tableName: users
            columnNames: username
            constraintName: uq_users_username
        - addUniqueConstraint:
            tableName: users
            columnNames: email
            constraintName: uq_users_email
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: roles
            columnNames: name
            constraintName: uq_roles_name
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: uuid
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role_id
            constraintName: pk_user_roles
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_role
            onDelete: CASCADE
  - changeSet:
      id: 002-seed-users-and-roles
      author: boost
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: id
                  value: "11111111-1111-1111-1111-111111111111"
              - column:
                  name: username
                  value: alice
              - column:
                  name: email
                  value: alice@example.com
              - column:
                  name: full_name
                  value: Alice Doe
        - insert:
            tableName: users
            columns:
              - column:
                  name: id
                  value: "22222222-2222-2222-2222-222222222222"
              - column:
                  name: username
                  value: bob
              - column:
                  name: email
                  value: bob@example.com
              - column:
                  name: full_name
                  value: Bob Smith
        - insert:
            tableName: users
            columns:
              - column:
                  name: id
                  value: "33333333-3333-3333-3333-333333333333"
              - column:
                  name: username
                  value: carla
              - column:
                  name: email
                  value: carla@example.com
              - column:
                  name: full_name
                  value: Carla Diaz
        - insert:
            tableName: roles
            columns:
              - column:
                  name: id
                  value: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
              - column:
                  name: name
                  value: ADMIN
        - insert:
            tableName: roles
            columns:
              - column:
                  name: id
                  value: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
              - column:
                  name: name
                  value: USER
        - insert:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  value: "11111111-1111-1111-1111-111111111111"
              - column:
                  name: role_id
                  value: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
        - insert:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  value: "11111111-1111-1111-1111-111111111111"
              - column:
                  name: role_id
                  value: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
  - changeSet:
      id: 003-create-categories-and-products
      author: boost
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: uuid
        - addForeignKeyConstraint:
            baseTableName: categories
            baseColumnNames: parent_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_categories_parent
            onDelete: SET NULL
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: sku
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: numeric(14,2)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: uuid
        - addUniqueConstraint:
            tableName: products
            columnNames: sku
            constraintName: uq_products_sku
        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_products_category
            onDelete: SET NULL
        - insert:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  value: "22222222-2222-2222-2222-222222222222"
              - column:
                  name: role_id
                  value: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
