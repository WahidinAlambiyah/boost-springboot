databaseChangeLog:
  - changeSet:
      id: 006-create-role-permissions-table
      author: boost
      changes:
        - createTable:
            schemaName: fastworks_springboot
            tableName: role_permissions
            columns:
              - column:
                  name: role_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: permission_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: assigned_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addPrimaryKey:
            schemaName: fastworks_springboot
            tableName: role_permissions
            columnNames: role_id, permission_id
            constraintName: pk_role_permissions
        - addForeignKeyConstraint:
            baseTableSchemaName: fastworks_springboot
            baseTableName: role_permissions
            baseColumnNames: role_id
            referencedTableSchemaName: fastworks_springboot
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_role_permissions_role
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: fastworks_springboot
            baseTableName: role_permissions
            baseColumnNames: permission_id
            referencedTableSchemaName: fastworks_springboot
            referencedTableName: permissions
            referencedColumnNames: id
            constraintName: fk_role_permissions_permission
            onDelete: RESTRICT
        - createIndex:
            schemaName: fastworks_springboot
            tableName: role_permissions
            indexName: idx_role_permissions_role_id
            columns:
              - column:
                  name: role_id
        - createIndex:
            schemaName: fastworks_springboot
            tableName: role_permissions
            indexName: idx_role_permissions_permission_id
            columns:
              - column:
                  name: permission_id
