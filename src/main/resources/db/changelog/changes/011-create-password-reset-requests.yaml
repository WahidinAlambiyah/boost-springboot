databaseChangeLog:
  - changeSet:
      id: 011-create-password-reset-requests
      author: boost
      changes:
        - createTable:
            schemaName: fastworks_springboot
            tableName: password_reset_requests
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: otp_hash
                  type: varchar(255)
              - column:
                  name: token_hash
                  type: varchar(255)
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: attempt_count
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: timestamptz
              - column:
                  name: otp_last_sent_at
                  type: timestamptz
              - column:
                  name: requested_ip
                  type: varchar(64)
              - column:
                  name: requested_user_agent
                  type: varchar(512)
              - column:
                  name: confirmed_ip
                  type: varchar(64)
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: fastworks_springboot
            tableName: password_reset_requests
            indexName: idx_password_reset_email_status
            columns:
              - column:
                  name: email
              - column:
                  name: status
        - createIndex:
            schemaName: fastworks_springboot
            tableName: password_reset_requests
            indexName: idx_password_reset_expires_at
            columns:
              - column:
                  name: expires_at
        - createIndex:
            schemaName: fastworks_springboot
            tableName: password_reset_requests
            indexName: idx_password_reset_user_id
            columns:
              - column:
                  name: user_id
