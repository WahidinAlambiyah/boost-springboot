databaseChangeLog:
  - changeSet:
      id: 018-add-menu-admin-permissions
      author: codex
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              insert into fastworks_springboot.permissions (code, name, description, module, is_active, created_at, updated_at)
              values
                ('MENU_READ', 'Menu Read', 'Read menu admin data', 'MENU', true, now(), now()),
                ('MENU_WRITE', 'Menu Write', 'Manage menu admin data', 'MENU', true, now(), now()),
                ('MENU_ASSIGN', 'Menu Assign', 'Assign permission to menu', 'MENU', true, now(), now())
              on conflict (code) do nothing;

              insert into fastworks_springboot.role_permissions (role_id, permission_id, assigned_at)
              select r.id, p.id, now()
              from fastworks_springboot.roles r
              join fastworks_springboot.permissions p on p.code in ('MENU_READ', 'MENU_WRITE', 'MENU_ASSIGN')
              where r.code = 'ROLE_ADMIN'
              on conflict (role_id, permission_id) do nothing;
