  - changeSet:
      id: 020-004-add-academy-foreign-key-constraints
      author: codex
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              do $$
              begin
                if not exists (select 1 from pg_constraint where conname = 'fk_students_academy') then
                  alter table fastworks_springboot.students
                    add constraint fk_students_academy
                    foreign key (academy_id)
                    references fastworks_springboot.academies(id);
                end if;

                if not exists (select 1 from pg_constraint where conname = 'fk_guardians_academy') then
                  alter table fastworks_springboot.guardians
                    add constraint fk_guardians_academy
                    foreign key (academy_id)
                    references fastworks_springboot.academies(id);
                end if;

                if not exists (select 1 from pg_constraint where conname = 'fk_programs_academy') then
                  alter table fastworks_springboot.programs
                    add constraint fk_programs_academy
                    foreign key (academy_id)
                    references fastworks_springboot.academies(id);
                end if;

                if not exists (select 1 from pg_constraint where conname = 'fk_courses_academy') then
                  alter table fastworks_springboot.courses
                    add constraint fk_courses_academy
                    foreign key (academy_id)
                    references fastworks_springboot.academies(id);
                end if;

                if not exists (select 1 from pg_constraint where conname = 'fk_class_groups_academy') then
                  alter table fastworks_springboot.class_groups
                    add constraint fk_class_groups_academy
                    foreign key (academy_id)
                    references fastworks_springboot.academies(id);
                end if;

                if not exists (select 1 from pg_constraint where conname = 'fk_class_sessions_academy') then
                  alter table fastworks_springboot.class_sessions
                    add constraint fk_class_sessions_academy
                    foreign key (academy_id)
                    references fastworks_springboot.academies(id);
                end if;

                if not exists (select 1 from pg_constraint where conname = 'fk_enrollments_academy') then
                  alter table fastworks_springboot.enrollments
                    add constraint fk_enrollments_academy
                    foreign key (academy_id)
                    references fastworks_springboot.academies(id);
                end if;

                if not exists (select 1 from pg_constraint where conname = 'fk_invoices_academy') then
                  alter table fastworks_springboot.invoices
                    add constraint fk_invoices_academy
                    foreign key (academy_id)
                    references fastworks_springboot.academies(id);
                end if;

                if not exists (select 1 from pg_constraint where conname = 'fk_payments_academy') then
                  alter table fastworks_springboot.payments
                    add constraint fk_payments_academy
                    foreign key (academy_id)
                    references fastworks_springboot.academies(id);
                end if;

                if not exists (select 1 from pg_constraint where conname = 'fk_notifications_academy') then
                  alter table fastworks_springboot.notifications
                    add constraint fk_notifications_academy
                    foreign key (academy_id)
                    references fastworks_springboot.academies(id);
                end if;
              end
              $$;