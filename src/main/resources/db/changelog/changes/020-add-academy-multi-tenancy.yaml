              alter table if exists fastworks_springboot.students alter column academy_id set not null;
              alter table if exists fastworks_springboot.guardians alter column academy_id set not null;
              alter table if exists fastworks_springboot.programs alter column academy_id set not null;
              alter table if exists fastworks_springboot.courses alter column academy_id set not null;
              alter table if exists fastworks_springboot.class_groups alter column academy_id set not null;
              alter table if exists fastworks_springboot.class_sessions alter column academy_id set not null;
              alter table if exists fastworks_springboot.enrollments alter column academy_id set not null;
              alter table if exists fastworks_springboot.invoices alter column academy_id set not null;
              alter table if exists fastworks_springboot.payments alter column academy_id set not null;
