databaseChangeLog:
  - changeSet:
      id: 022-001-alter-class-sessions-add-location-and-notes
      author: codex
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              alter table if exists fastworks_springboot.class_sessions
                add column if not exists location_id uuid;

              alter table if exists fastworks_springboot.class_sessions
                add column if not exists notes text;

              do $$
              begin
                if not exists (select 1 from pg_constraint where conname = 'fk_class_sessions_location') then
                  alter table fastworks_springboot.class_sessions
                    add constraint fk_class_sessions_location
                    foreign key (location_id)
                    references fastworks_springboot.academy_locations(id);
                end if;
              end
              $$;

  - changeSet:
      id: 022-002-create-class-session-coaches
      author: codex
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              create table if not exists fastworks_springboot.class_session_coaches (
                id uuid primary key default gen_random_uuid(),
                academy_id uuid not null references fastworks_springboot.academies(id),
                class_session_id uuid not null references fastworks_springboot.class_sessions(id),
                coach_id uuid not null references fastworks_springboot.coach_profiles(id),
                coach_role varchar(50),
                attendance_status varchar(30),
                check_in_at timestamptz,
                check_out_at timestamptz,
                notes text,
                created_at timestamptz not null default now(),
                updated_at timestamptz not null default now(),
                deleted_at timestamptz
              );

              create unique index if not exists uk_class_session_coaches_active_session_coach
                on fastworks_springboot.class_session_coaches(class_session_id, coach_id)
                where deleted_at is null;

              create index if not exists idx_class_session_coaches_academy_session
                on fastworks_springboot.class_session_coaches(academy_id, class_session_id);

              create index if not exists idx_class_session_coaches_coach_deleted
                on fastworks_springboot.class_session_coaches(coach_id, deleted_at);
