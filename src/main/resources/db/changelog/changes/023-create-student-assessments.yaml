databaseChangeLog:
  - changeSet:
      id: 023-001-create-assessment-skills
      author: codex
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              create table if not exists fastworks_springboot.assessment_skills (
                id uuid primary key default gen_random_uuid(),
                academy_id uuid references fastworks_springboot.academies(id),
                code varchar(50) not null,
                name varchar(150) not null,
                description text,
                created_at timestamptz not null default now(),
                updated_at timestamptz not null default now(),
                deleted_at timestamptz
              );

              create unique index if not exists uk_assessment_skills_active_academy_code
                on fastworks_springboot.assessment_skills(academy_id, code)
                where deleted_at is null;

  - changeSet:
      id: 023-002-create-student-assessments
      author: codex
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              create table if not exists fastworks_springboot.student_assessments (
                id uuid primary key default gen_random_uuid(),
                academy_id uuid not null references fastworks_springboot.academies(id),
                class_session_id uuid not null references fastworks_springboot.class_sessions(id),
                student_id uuid not null references fastworks_springboot.students(id),
                coach_id uuid not null references fastworks_springboot.coach_profiles(id),
                assessed_at timestamptz not null,
                notes text,
                created_at timestamptz not null default now(),
                updated_at timestamptz not null default now(),
                deleted_at timestamptz
              );

              create index if not exists idx_student_assessments_academy_assessed_at
                on fastworks_springboot.student_assessments(academy_id, assessed_at);

              create index if not exists idx_student_assessments_student_assessed_at
                on fastworks_springboot.student_assessments(student_id, assessed_at);

              create index if not exists idx_student_assessments_class_session
                on fastworks_springboot.student_assessments(class_session_id);

  - changeSet:
      id: 023-003-create-student-assessment-scores
      author: codex
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              create table if not exists fastworks_springboot.student_assessment_scores (
                id uuid primary key default gen_random_uuid(),
                assessment_id uuid not null,
                skill_id uuid not null,
                score numeric(5,2) not null,
                notes text,
                created_at timestamptz not null default now(),
                updated_at timestamptz not null default now(),
                deleted_at timestamptz
              );

              do $$
              begin
                if not exists (select 1 from pg_constraint where conname = 'fk_student_assessment_scores_assessment') then
                  alter table fastworks_springboot.student_assessment_scores
                    add constraint fk_student_assessment_scores_assessment
                    foreign key (assessment_id)
                    references fastworks_springboot.student_assessments(id)
                    on delete cascade;
                end if;
              end
              $$;

              do $$
              begin
                if not exists (select 1 from pg_constraint where conname = 'fk_student_assessment_scores_skill') then
                  alter table fastworks_springboot.student_assessment_scores
                    add constraint fk_student_assessment_scores_skill
                    foreign key (skill_id)
                    references fastworks_springboot.assessment_skills(id);
                end if;
              end
              $$;

              create unique index if not exists uk_student_assessment_scores_assessment_skill
                on fastworks_springboot.student_assessment_scores(assessment_id, skill_id);
