databaseChangeLog:
  - changeSet:
      id: 026-001-create-training-packages
      author: codex
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              create table if not exists fastworks_springboot.training_packages (
                id uuid primary key default gen_random_uuid(),
                academy_id uuid not null references fastworks_springboot.academies(id),
                code varchar(50) not null,
                name varchar(255) not null,
                package_type varchar(50) not null,
                total_sessions integer not null,
                price numeric(14,2) not null,
                is_active boolean not null default true,
                description text,
                created_at timestamptz not null default now(),
                updated_at timestamptz not null default now(),
                deleted_at timestamptz
              );

              create unique index if not exists uk_training_packages_active_academy_code
                on fastworks_springboot.training_packages(academy_id, code)
                where deleted_at is null;

              create index if not exists idx_training_packages_academy_type_active
                on fastworks_springboot.training_packages(academy_id, package_type, is_active);

  - changeSet:
      id: 026-002-create-student-package-subscriptions
      author: codex
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              create table if not exists fastworks_springboot.student_package_subscriptions (
                id uuid primary key default gen_random_uuid(),
                academy_id uuid not null references fastworks_springboot.academies(id),
                student_id uuid not null references fastworks_springboot.students(id),
                package_id uuid not null references fastworks_springboot.training_packages(id),
                status varchar(30) not null,
                start_date date not null,
                end_date date,
                remaining_sessions integer not null,
                created_at timestamptz not null default now(),
                updated_at timestamptz not null default now(),
                deleted_at timestamptz
              );

              create index if not exists idx_student_package_subscriptions_query
                on fastworks_springboot.student_package_subscriptions(academy_id, student_id, status, deleted_at);

  - changeSet:
      id: 026-003-create-coach-payroll-periods
      author: codex
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              create table if not exists fastworks_springboot.coach_payroll_periods (
                id uuid primary key default gen_random_uuid(),
                academy_id uuid not null references fastworks_springboot.academies(id),
                period_month integer not null,
                period_year integer not null,
                status varchar(30) not null,
                generated_at timestamptz,
                approved_at timestamptz,
                paid_at timestamptz,
                created_at timestamptz not null default now(),
                updated_at timestamptz not null default now(),
                deleted_at timestamptz
              );

              create unique index if not exists uk_coach_payroll_periods_academy_month_year
                on fastworks_springboot.coach_payroll_periods(academy_id, period_month, period_year);

  - changeSet:
      id: 026-004-create-coach-payroll-items
      author: codex
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              create table if not exists fastworks_springboot.coach_payroll_items (
                id uuid primary key default gen_random_uuid(),
                payroll_period_id uuid not null references fastworks_springboot.coach_payroll_periods(id),
                coach_id uuid not null references fastworks_springboot.coach_profiles(id),
                base_amount numeric(14,2) not null default 0,
                bonus_amount numeric(14,2) not null default 0,
                deduction_amount numeric(14,2) not null default 0,
                total_amount numeric(14,2) not null,
                created_at timestamptz not null default now(),
                updated_at timestamptz not null default now(),
                deleted_at timestamptz
              );

              create index if not exists idx_coach_payroll_items_period_coach
                on fastworks_springboot.coach_payroll_items(payroll_period_id, coach_id);
