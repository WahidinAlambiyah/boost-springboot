databaseChangeLog:
  - changeSet:
      id: 035-master-student-coach-crud-support
      author: codex
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              alter table fastworks_springboot.students
                add column if not exists academy_id uuid,
                add column if not exists nickname varchar(100),
                add column if not exists status varchar(30) not null default 'ACTIVE',
                add column if not exists current_level varchar(50),
                add column if not exists gender varchar(20),
                add column if not exists guardian_name varchar(255),
                add column if not exists guardian_phone varchar(50);

              update fastworks_springboot.students s
                 set academy_id = a.id
                from (select id from fastworks_springboot.academies order by created_at asc limit 1) a
               where s.academy_id is null;

              alter table fastworks_springboot.students
                add constraint fk_students_academy
                foreign key (academy_id) references fastworks_springboot.academies(id)
                deferrable initially immediate;

              create index if not exists idx_students_academy_status
                on fastworks_springboot.students(academy_id, status)
                where deleted_at is null;

              create table if not exists fastworks_springboot.coach_profiles (
                id uuid primary key default gen_random_uuid(),
                academy_id uuid not null references fastworks_springboot.academies(id),
                user_id uuid references fastworks_springboot.users(id),
                coach_no varchar(50),
                full_name varchar(255) not null,
                phone varchar(50),
                specialties text,
                bio text,
                employment_type varchar(30) not null default 'PART_TIME',
                pay_type varchar(30) not null default 'PER_SESSION',
                is_active boolean not null default true,
                created_at timestamptz not null default now(),
                updated_at timestamptz not null default now(),
                deleted_at timestamptz
              );

              create unique index if not exists uk_coach_profiles_coach_no
                on fastworks_springboot.coach_profiles(coach_no)
                where coach_no is not null and deleted_at is null;

              create index if not exists idx_coach_profiles_academy_active
                on fastworks_springboot.coach_profiles(academy_id, is_active)
                where deleted_at is null;
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              drop index if exists fastworks_springboot.idx_coach_profiles_academy_active;
              drop index if exists fastworks_springboot.uk_coach_profiles_coach_no;
              drop table if exists fastworks_springboot.coach_profiles;
