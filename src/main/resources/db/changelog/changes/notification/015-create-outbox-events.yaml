databaseChangeLog:
  - logicalFilePath: db/changelog/changes/015-create-outbox-events.yaml
  - changeSet:
      id: 015-001-create-outbox-events
      author: codex
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              create table if not exists fastworks_springboot.outbox_events (
                id uuid primary key default gen_random_uuid(),
                aggregate_type varchar(80) not null,
                aggregate_id uuid not null,
                event_type varchar(120) not null,
                correlation_id varchar(120),
                request_id varchar(120),
                payload text not null,
                status varchar(30) not null default 'NEW',
                attempts integer not null default 0,
                occurred_at timestamptz not null default now(),
                published_at timestamptz,
                last_error text,
                created_at timestamptz not null default now(),
                updated_at timestamptz not null default now()
              );

              create index if not exists idx_outbox_events_status_created_at
                on fastworks_springboot.outbox_events(status, created_at);

              create index if not exists idx_outbox_events_correlation_id
                on fastworks_springboot.outbox_events(correlation_id);
