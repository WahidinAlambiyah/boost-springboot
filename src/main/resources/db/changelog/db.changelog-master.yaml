databaseChangeLog:
  - changeSet:
      id: 001-create-role-and-user
      author: boost
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(255)
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(150)
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
                  defaultValueBoolean: true
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            columnNames: user_id, role_id
            constraintName: pk_user_roles
            tableName: user_roles
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_role
            onDelete: CASCADE
  - changeSet:
      id: 002-seed-roles-and-admin
      author: boost
      changes:
        - insert:
            tableName: roles
            columns:
              - column: { name: name, value: ADMIN }
              - column: { name: description, value: Administrator }
        - insert:
            tableName: roles
            columns:
              - column: { name: name, value: USER }
              - column: { name: description, value: Standard user }
        - insert:
            tableName: users
            columns:
              - column: { name: username, value: admin }
              - column: { name: email, value: admin@example.com }
              - column: { name: password, value: $2a$10$7EqJtq98hPqEX7fNZaFWoO5f.SG5.zj.B8GPUY5Y2G/92eN7wPFyW }
              - column: { name: full_name, value: Admin Account }
              - column: { name: active, valueBoolean: true }
        - insert:
            tableName: user_roles
            columns:
              - column: { name: user_id, valueNumeric: 1 }
              - column: { name: role_id, valueNumeric: 1 }
