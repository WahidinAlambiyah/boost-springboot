spring:
  datasource:
    url: jdbc:h2:mem:testdb_${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:fastworks_springboot_graphql}
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
    default-schema: ${DB_SCHEMA:fastworks_springboot_graphql}
    liquibase-schema: PUBLIC
    parameters:
      schema: ${DB_SCHEMA:fastworks_springboot_graphql}
