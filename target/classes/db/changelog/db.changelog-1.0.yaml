              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: poh_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: item_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: item_qty
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: item_cost
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: item_price
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(255)
              - column:
                  name: created_datetime
                  type: TIMESTAMP
              - column:
                  name: updated_by
                  type: VARCHAR(255)
              - column:
                  name: updated_datetime
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: po_d
            baseColumnNames: poh_id
            constraintName: fk_po_d_poh
            referencedTableName: po_h
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: po_d
            baseColumnNames: item_id
            constraintName: fk_po_d_item
            referencedTableName: item
            referencedColumnNames: id
